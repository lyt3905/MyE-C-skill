[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mye-c-automation"
version = "0.2.31"
description = "Independent AliExpress V2 product image automation"
requires-python = ">=3.12"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3", "opencv-python>=4.10,<6", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10"]
lama = ["torch>=2.2,<3"]
legacy-ocr = ["rapidocr-onnxruntime>=1.3,<2"]

[project.scripts]
myec-automation = "mye_c_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mye_c_automation = ["config/*.json", "config/*.md", "config/schemas/*.json", "prompts/*.md", "assets/watermarks/*", "assets/deployment/*.ps1"]
